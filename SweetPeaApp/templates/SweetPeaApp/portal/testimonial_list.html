{% load static %}

  <section class="portal-wrapper">
    <h1>Manage Testimonials</h1>

    <a href="{% url 'portal_testimonial_form.html' %}" class="btn">+ Add new testimonial</a>

    {% for t in testimonials %}
      <article class="portal-card">
        <p>{{ t.body }}</p>
        <small>{{ t.reviewer }} – {{ t.location }}</small>
        <div class="portal-actions">
          <a href="{% url 'portal_testimonial_edit' t.pk %}">Edit</a>
          <a href="{% url 'portal_testimonial_delete' t.pk %}">Delete</a>
        </div>
      </article>
    {% empty %}
      <p>No testimonials yet.</p>
    {% endfor %}
  </section>
