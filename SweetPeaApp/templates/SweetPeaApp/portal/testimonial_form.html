{% load static %}
<link rel="stylesheet" href="{% static 'SweetPeaApp/css/portal_testimonials.css' %}">

<section class="portal-wrapper">
  <h1>
    {% if object %}Edit testimonial{% else %}Add testimonial{% endif %}
  </h1>

  <form method="post" class="portal-form">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="form-row">
      <label for="{{ form.body.id_for_label }}">Testimonial</label>
      {{ form.body }}
      {{ form.body.errors }}
    </div>

    <div class="form-row">
      <label for="{{ form.reviewer.id_for_label }}">Name (optional)</label>
      {{ form.reviewer }}
      {{ form.reviewer.errors }}
    </div>

    <div class="form-row">
      <label for="{{ form.location.id_for_label }}">Location (optional)</label>
      {{ form.location }}
      {{ form.location.errors }}
    </div>

    <div class="form-actions">
      <button type="submit" class="btn">
        {% if object %}Save changes{% else %}Create testimonial{% endif %}
      </button>
      <a href="{% url 'portal_testimonial_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
