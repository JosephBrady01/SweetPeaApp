{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Resources – Admin Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{% static 'SweetPeaApp/css/portal.css' %}">
  <link rel="stylesheet" href="{% static 'SweetPeaApp/css/portal_testimonials.css' %}">
</head>

<section class="portal-wrapper">
  <h1>Delete resource</h1>

  <article class="portal-card">
    <p><strong>{{ object.title }}</strong></p>

    {% if object.description %}
      <p>{{ object.description }}</p>
    {% endif %}

    <small>
      Added {{ object.created_at|date:"j M Y" }}
    </small>
  </article>

  <form method="post" class="portal-form">
    {% csrf_token %}
    <p>
      Are you sure you want to delete this resource?
      This cannot be undone.
    </p>

    <div class="form-actions">
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'resources_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
