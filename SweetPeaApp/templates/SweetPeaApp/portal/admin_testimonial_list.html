{% load static %}

<link rel="stylesheet" href="{% static 'SweetPeaApp/css/portal_testimonials.css' %}">

<section class="portal-wrapper">
  <h1>Manage Testimonials</h1>

  <a href="{% url 'portal_testimonial_create' %}" class="btn">+ Add new testimonial</a>

  {% for t in testimonials %}
  <article class="portal-card">
    <p>{{ t.body }}</p>
    <small>{{ t.reviewer }} – {{ t.location }}</small>
    <div class="portal-actions">
      <a href="{% url 'portal_testimonial_edit' t.pk %}" class="btn btn-action">Edit</a>

      <a href="{% url 'portal_testimonial_delete' t.pk %}" class="btn btn-action btn-danger">Delete</a>
    </div>
  </article>
  {% empty %}
  <p>No testimonials yet.</p>
  {% endfor %}
</section>
